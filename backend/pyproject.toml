[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "greenlet>=3.0.0",
    "psycopg[binary,pool]>=3.1.18",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
